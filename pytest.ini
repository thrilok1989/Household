[pytest]
# `archive/` holds files removed from the running app in Stage B of the
# duplication cleanup (docs/DEAD_FILE_REPORT.md). Their tests moved with them,
# so they are kept — a module and its test belong together even in the attic —
# but they are NOT collected: they test code the app no longer loads, and a
# green tick on an archived module is exactly the "tested but not running"
# signal the cleanup exists to remove.
#
# If a file comes back out of `archive/`, its test comes with it and starts
# being collected again in the same move.
norecursedirs = archive .git __pycache__ .venv
